[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nero-action-chunk-control"
version = "0.1.0"
description = "NERO online action-chunk execution, trajectory shaping, and CPV control"
requires-python = ">=3.10"
dependencies = [
    "msgpack>=1.0",
    "numpy>=1.26",
    "pyAgxArm",
    "websockets>=12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nero_vla*"]
