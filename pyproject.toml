[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nero-vla"
version = "0.1.0"
description = "NERO real-robot state monitoring and VLA integration"
requires-python = ">=3.10"
dependencies = [
    "msgpack>=1.0",
    "numpy>=1.26",
    "pyAgxArm",
    "websockets>=12",
]

[project.scripts]
nero-state-monitor = "nero_vla.state_monitor:main"
nero-policy-probe = "nero_vla.policy_probe:main"
nero-synthetic-observation = "nero_vla.observation_pipeline:main"
nero-can-bridge = "nero_vla.leader_follower_bridge:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nero_vla*"]
